<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #FCF3FF; font-family: 'Segoe UI', sans-serif; }
        .card-custom { background: white; border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(147, 112, 219, 0.15); }
        .fp-box { width: 120px; height: 120px; border: 2px dashed #a855f7; border-radius: 16px; background: #f8f0fc; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; margin: 0 auto; }
        .btn-purple { background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); border: none; color: white; border-radius: 12px; font-weight: 600; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container col-md-4">
        <div class="card card-custom p-4">
            <h4 class="text-center fw-bold mb-1">Create Account</h4>
            <p class="text-center text-muted small mb-3">Register your biometric profile</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}{% for category, message in messages %}
                <div class="alert alert-{{ category }} p-2 small text-center">{{ message }}</div>
              {% endfor %}{% endif %}
            {% endwith %}

            <form action="/register" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3 text-center">
                    <label class="form-label small fw-semibold text-secondary d-block">Register Fingerprint</label>
                    <input type="file" id="fpInput" name="fingerprint" class="d-none" required onchange="document.getElementById('fpLabel').innerText = this.files[0].name">
                    <div class="fp-box" onclick="document.getElementById('fpInput').click()">
                        <i class="fa-solid fa-fingerprint fs-2 text-primary"></i>
                        <span class="small fw-bold text-purple mt-1" id="fpLabel">Upload Scan</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-purple w-100 py-2">Register User</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login" class="small text-decoration-none">Already have an account? Login</a>
            </div>
        </div>
    </div>
</body>
</html>
