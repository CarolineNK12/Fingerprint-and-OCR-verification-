<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Portal - Card Scanner & Biometric Security</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #FCF3FF; font-family: 'Segoe UI', sans-serif; }
        .role-card {
            background: #ffffff;
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(147, 112, 219, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.25);
        }
        .icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #f3e5fa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
        }
        .btn-purple {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            border: none;
            color: white;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container col-md-8 col-lg-6 text-center">
        <h2 class="fw-bold text-dark mb-2">Welcome to OCR Portal</h2>
        <p class="text-muted mb-5">Select your role to access the biometric system</p>

        <div class="row g-4">
            <!-- REGULAR USER Option -->
            <div class="col-md-6">
                <div class="role-card p-4 text-center h-100" onclick="window.location.href='/register'">
                    <div class="icon-box">
                        <i class="fa-solid fa-user fs-2 text-primary" style="color: #a855f7 !important;"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Regular User</h4>
                    <p class="text-muted small mb-4">Register a new account with a fingerprint & use the OCR Scanner</p>
                    <a href="/register" class="btn btn-purple w-100 py-2">Register User</a>
                    <div class="mt-2">
                        <a href="/login/user" class="small text-muted text-decoration-none">Already have an account? User Login</a>
                    </div>
                </div>
            </div>

            <!-- ADMIN Option -->
            <div class="col-md-6">
                <div class="role-card p-4 text-center h-100" onclick="window.location.href='/login/admin'">
                    <div class="icon-box">
                        <i class="fa-solid fa-user-shield fs-2 text-primary" style="color: #a855f7 !important;"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Admin</h4>
                    <p class="text-muted small mb-4">Admin login to approve new user registrations</p>
                    <a href="/login/admin" class="btn btn-outline-dark w-100 py-2" style="border-radius: 12px;">Admin Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
